<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>약 복용 일지</title><style>
:root{--ink:#213c38;--muted:#647570;--green:#226a58;--bg:#f4f6f1;--line:#dce4dc;--amber:#925319}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,'맑은 고딕',sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.wrap{max-width:1000px;margin:auto;padding:26px 24px}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:28px;letter-spacing:-1px;margin:0}h2{font-size:23px;margin:0 0 16px}h3{font-size:19px;margin:0}p{margin:6px 0}.sub,small{color:var(--muted);font-size:14px}.brand{display:flex;align-items:center;gap:13px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#e4efe7;color:var(--green);font-size:28px;font-weight:700}nav{display:flex;gap:6px;margin:0 0 28px;background:#e8eee7;border-radius:14px;padding:5px}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:46px;padding:9px 17px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:white}button:hover{background:#eef4ed}button:disabled{cursor:default;opacity:.45}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8fb5a6;outline-offset:2px}nav button{flex:1;background:transparent;border:0;font-weight:600}nav button.active{background:white;color:var(--green);box-shadow:0 2px 5px #21403112}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#195744}.danger{color:#9c422e}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 0;background:#e4eee5;border-radius:16px;padding:20px}.stats div{padding:0 18px;border-right:1px solid #cbd9cb}.stats div:last-child{border:0}.stats strong{display:block;font-size:30px;line-height:1.3}.stats span{font-size:14px;color:#4d6e5e}.dose{border-left:4px solid #cbd5cb}.dose.done{border-left-color:#3a8465}.dose.late{border-left-color:#c48a3e;background:#fffdf8}.pill{font-size:14px;padding:4px 10px;border-radius:20px;background:#eef0ec;white-space:nowrap}.done .pill{background:#e5f3e9;color:#256341}.late .pill{background:#fbefd9;color:#865315}.time{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.dosehead{display:flex;gap:18px;align-items:center}.empty{padding:32px 20px;text-align:center;background:#fff;border:1px dashed #cdd8cd;border-radius:14px;color:var(--muted)}label{display:block;font-size:15px;font-weight:600;margin:14px 0 6px}input,textarea,select{width:100%;border:1px solid #c7d3ca;background:white;border-radius:9px;padding:11px;color:var(--ink);min-height:46px}textarea{min-height:85px;resize:vertical}input[type=checkbox]{width:20px;min-height:20px;vertical-align:middle}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.timeentry{display:flex;gap:8px;margin:8px 0}.timeentry input{flex:1;min-width:0}.notice{background:#fff2db;border:1px solid #e7c995;border-radius:14px;padding:18px;margin-bottom:20px}.error{color:#a13525;white-space:pre-wrap}.hidden,[hidden]{display:none!important}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:15px 0}.weekday{text-align:center;font-size:13px;color:var(--muted)}.day{padding:8px 2px;min-height:77px;border-radius:9px;text-align:center;font-size:15px}.day small{display:block;font-size:11px}.day.complete{background:#e5f1e7}.day.partial{background:#fff1dc}.day.selected{outline:2px solid var(--green);outline-offset:-2px}.day:disabled{background:#f3f4f1}.period{margin:16px 0}.recordline{border-top:1px solid var(--line);padding:10px 0;overflow-wrap:anywhere}.memo{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.foot{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}dialog{border:0;border-radius:18px;padding:26px;width:min(540px,calc(100% - 28px));max-height:90vh;color:var(--ink)}dialog::backdrop{background:#20362c70}.dialogfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.caption{font-size:13px;letter-spacing:1px;color:var(--green);font-weight:700;margin-bottom:5px}#saveState{font-size:13px;text-align:right}#saveState.error{max-width:380px}.sectiontop{margin-bottom:18px}.progress{height:6px;border-radius:6px;background:#d6e2d6;overflow:hidden;margin-top:-8px;margin-bottom:24px}.progress>div{height:100%;background:var(--green)}@media(max-width:600px){body{font-size:16px}.wrap{padding:20px 15px}header .wrap{padding:18px 15px}h1{font-size:23px}header .sub{display:none}.mark{width:37px;height:37px}nav{gap:0;margin-bottom:22px}nav button{padding:10px 4px;font-size:14px}.card{padding:17px}.grid2{grid-template-columns:1fr;gap:0}.stats{padding:15px 0}.stats div{padding:0 14px}.stats strong{font-size:27px}.dosehead{gap:12px}.calendar{gap:3px}.day small{font-size:10px}.day{min-height:70px}.row>.actions{width:100%}.row>.actions button{flex:1}#saveState{max-width:130px}dialog{padding:20px}.time{font-size:21px}}
</style></head><body><header><div class="wrap"><div class="brand"><div class="mark" aria-hidden="true">＋</div><div><h1>약 복용 일지</h1><p class="sub">오늘의 복용부터, 하루의 기록까지</p></div></div><div id="saveState" role="status">이 기기에 자동 저장</div></div></header><main class="wrap"><nav aria-label="화면 선택"><button data-tab="today" class="active">오늘의 복용</button><button data-tab="meds">약 등록·관리</button><button data-tab="history">지난 기록</button><button data-tab="notes">메모</button></nav><aside id="alerts" class="notice" role="status" hidden></aside><div id="view"></div><footer class="foot">기록은 현재 기기·브라우저에만 저장됩니다. 브라우저 데이터를 삭제하면 기록이 사라질 수 있습니다.<br>화면 알림은 이 페이지가 화면에 열려 있을 때만 제공됩니다. 소리 알림은 없습니다.</footer></main><dialog id="modal"><div id="modalContent"></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='medicine-diary-v1',pad=n=>String(n).padStart(2,'0');
function dateStr(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
const today=()=>dateStr(new Date()),nowTime=()=>`${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`,parseDate=s=>new Date(s+'T12:00:00'),addDays=(s,n)=>{let d=parseDate(s);d.setDate(d.getDate()+n);return dateStr(d)},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
let db={meds:[],records:{},daily:{}},tab='today',selected=today(),month=today().slice(0,7),mode='day',storageOK=true,seen=new Set(),alertItems=new Map(),dayAtOpen=today();
try{let s=localStorage.getItem(KEY);if(s){let d=JSON.parse(s);if(!Array.isArray(d.meds)||!d.records||!d.daily)throw Error();db=d}localStorage.setItem(KEY,JSON.stringify(db))}catch(e){storageOK=false;$('#saveState').textContent='기록을 불러오거나 저장할 수 없습니다. 이 화면의 변경은 저장되지 않습니다.';$('#saveState').className='error'}
function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(db));$('#saveState').textContent='자동 저장됨';$('#saveState').className=''}catch(e){$('#saveState').textContent='저장 실패: 브라우저 저장 공간을 확인해 주세요.';$('#saveState').className='error'}}
function version(m,d){return m.versions.filter(v=>v.effective<=d).sort((a,b)=>a.effective.localeCompare(b.effective)||a.seq-b.seq).at(-1)}
function active(v,d){return v&&!v.stopped&&v.start<=d&&(!v.end||v.end>=d)}
function keyFor(m,d,slot){return `${m.id}|${d}|${slot}`}
function rows(d){let result=[];for(let m of db.meds){let v=version(m,d);if(active(v,d)&&v.type==='regular')v.times.forEach((t,i)=>{let key=keyFor(m,d,i),rec=db.records[key];result.push({key,medId:m.id,slot:i,date:d,time:t,name:v.name,dose:v.dose,info:v.info,...(rec?.snapshot||{}),done:!!rec?.done,actual:rec?.actual||'',unknown:!!rec?.unknown,note:rec?.note||''})})}for(let [key,r] of Object.entries(db.records)){if(r.date!==d||r.prn||!r.pinned||result.some(x=>x.key===key))continue;result.push({key,medId:r.medId,slot:r.slot,date:d,...r.snapshot,done:!!r.done,actual:r.actual||'',unknown:!!r.unknown,note:r.note||''})}return result.sort((a,b)=>a.time.localeCompare(b.time)||a.name.localeCompare(b.name))}
function prns(d){return Object.entries(db.records).filter(([,r])=>r.date===d&&r.prn).map(([key,r])=>({key,...r,...r.snapshot})).sort((a,b)=>(a.actual||'99').localeCompare(b.actual||'99'))}
function counts(d){let a=rows(d);return {total:a.length,done:a.filter(x=>x.done).length}}
function ensure(r){return db.records[r.key]??= {date:r.date,medId:r.medId,slot:r.slot,done:false,note:'',actual:'',unknown:false}}
function snapshot(r){return {name:r.name,dose:r.dose,info:r.info,time:r.time}}
function freezeCompleted(m,d){for(let r of rows(d).filter(r=>r.medId===m.id&&r.done)){let rec=ensure(r);rec.snapshot=snapshot(r);rec.pinned=true}}
function stats(d){let c=counts(d);return `<div class="stats"><div><strong>${c.done}</strong><span>복용 완료</span></div><div><strong>${c.total-c.done}</strong><span>남은 복용</span></div><div><strong>${c.total}</strong><span>예정 횟수</span></div></div><div class="progress"><div style="width:${c.total?c.done/c.total*100:0}%"></div></div>`}
function doseCard(r){let late=r.date===today()&&!r.done&&r.time<=nowTime();return `<article class="card dose ${r.done?'done':late?'late':''}"><div class="row"><div class="dosehead"><span class="time">${esc(r.time)}</span><div><h3>${esc(r.name)}</h3><span class="sub">1회 ${esc(r.dose)}</span></div></div><span class="pill">${r.done?'✓ 복용 완료':late?'미복용 · 시각 지남':'미복용'}</span></div>${r.info?`<p class="sub">${esc(r.info)}</p>`:''}${r.done?`<p>실제 복용: <strong>${r.unknown?'시각 미상':esc(r.actual)}</strong></p>`:''}${r.note?`<p class="memo">메모: ${esc(r.note)}</p>`:''}<div class="actions" style="margin-top:15px"><button class="${r.done?'':'primary'}" data-action="toggle" data-key="${r.key}" data-date="${r.date}">${r.done?'체크 취소':'복용 체크'}</button><button data-action="record" data-key="${r.key}" data-date="${r.date}">${r.done?'시각·메모 수정':'메모 작성'}</button></div></article>`}
function prnSection(d){let a=prns(d);return `<div class="row" style="margin-top:30px"><h2>필요할 때 먹은 약</h2><button data-action="addprn" data-date="${d}">＋ 복용 기록</button></div><p class="sub">예정된 완료·남은 횟수에는 포함하지 않습니다.</p>${a.length?a.map(r=>`<article class="card"><div class="row"><div><h3>${esc(r.name)}</h3><p class="sub">1회 ${esc(r.dose)} · ${r.unknown?'시각 미상':esc(r.actual)}</p></div><button data-action="prnedit" data-key="${r.key}" data-date="${d}">기록 수정</button></div>${r.note?`<p class="memo">${esc(r.note)}</p>`:''}</article>`).join(''):'<p class="sub">기록된 필요시약이 없습니다.</p>'}`}
function dayMemo(d){return `<section class="card"><h3>하루 메모</h3><label for="dayNote">${d} 몸 상태와 특이사항</label><textarea id="dayNote" data-date="${d}" placeholder="오늘의 몸 상태를 남겨 보세요.">${esc(db.daily[d]||'')}</textarea><p class="sub">입력한 내용은 자동으로 저장됩니다.</p></section>`}
function datePicker(d,id='selectDate'){return `<label for="${id}">조회 날짜</label><input id="${id}" type="date" max="${today()}" value="${d}">`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});let out='';if(tab==='today'){let d=today(),a=rows(d);out=`<div class="row sectiontop"><div><div class="caption">매일의 건강 기록</div><h2 style="margin:0">오늘의 복용</h2><p class="sub">${parseDate(d).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</p></div><button class="primary" data-action="newmed">＋ 약 등록</button></div>${stats(d)}${a.length?a.map(doseCard).join(''):'<div class="empty">오늘 예정된 복용이 없습니다.<br>약 등록·관리에서 복용할 약을 등록해 주세요.</div>'}${prnSection(d)}${dayMemo(d)}`}
if(tab==='meds'){out=`<div class="row"><h2>약 등록·관리</h2><button class="primary" data-action="newmed">＋ 약 등록</button></div><p class="sub">변경·중단 적용일을 선택하면 이전 기록은 그대로 유지됩니다.</p>${db.meds.length?db.meds.map(m=>{let v=version(m,today())||m.versions[0];return `<article class="card"><div class="row"><div><h3>${esc(v.name)}</h3><p>${esc(v.dose)} · ${v.type==='prn'?'필요시약':v.times.join(' · ')}</p><p class="sub">${v.start}부터 ${v.end?'~ '+v.end:' · 종료일 없음'}${v.stopped?' · 중단됨':''}</p>${v.info?`<p class="memo">${esc(v.info)}</p>`:''}</div><div class="actions"><button data-action="editmed" data-id="${m.id}">수정</button><button class="danger" data-action="stop" data-id="${m.id}">복용 중단</button></div></div>${m.versions.filter(x=>x.effective>today()).map(x=>`<p class="sub">${x.effective} 적용 예정: ${x.stopped?'복용 중단':esc(x.name)+' · '+esc(x.dose)+' · '+(x.type==='prn'?'필요시약':x.times.join(' · '))}</p>`).join('')}</article>`}).join(''):'<div class="empty">아직 등록한 약이 없습니다.</div>'}`}
if(tab==='history'){out=`<h2>지난 기록</h2><div class="actions">${[['day','달력·날짜별'],['week','주간'],['month','월간']].map(([k,v])=>`<button class="${mode===k?'primary':''}" data-mode="${k}">${v}</button>`).join('')}</div>${mode==='day'?calendar():datePicker(selected)}${mode==='day'?`<h3>${selected} 복용 기록</h3>${stats(selected)}${rows(selected).length?rows(selected).map(doseCard).join(''):'<p class="empty">예정된 복용이 없습니다.</p>'}${prnSection(selected)}${dayMemo(selected)}`:periodList()}`}
if(tab==='notes'){out=`<h2>메모</h2>${datePicker(selected)}${dayMemo(selected)}<h3>약별 복용 메모</h3>${rows(selected).length?rows(selected).map(r=>`<article class="card"><div class="row"><div><h3>${esc(r.name)} · ${r.time}</h3><p class="sub">${r.done?'복용 완료':'미복용'}</p></div><button data-action="record" data-key="${r.key}" data-date="${selected}">메모 수정</button></div><p class="memo">${esc(r.note||'작성된 메모가 없습니다.')}</p></article>`).join(''):'<p class="sub">예정된 약이 없습니다.</p>'}${prnSection(selected)}`}
$('#view').innerHTML=out;checkAlerts()}
function calendar(){let first=month+'-01',end=new Date(+month.slice(0,4),+month.slice(5),0).getDate(),offset=(parseDate(first).getDay()+6)%7;return `<div class="row" style="margin-top:20px"><button data-action="prevmonth" aria-label="이전 달">‹</button><h3>${month.replace('-','년 ')}월</h3><button data-action="nextmonth" aria-label="다음 달" ${month>=today().slice(0,7)?'disabled':''}>›</button></div><div class="calendar">${['월','화','수','목','금','토','일'].map(x=>`<div class="weekday">${x}</div>`).join('')}${'<div></div>'.repeat(offset)}${Array.from({length:end},(_,i)=>{let d=month+'-'+pad(i+1),c=counts(d),future=d>today();return `<button class="day ${d===selected?'selected':''} ${c.total?(c.done===c.total?'complete':'partial'):''}" data-action="pickday" data-date="${d}" ${future?'disabled':''} aria-label="${d} ${future?'미래 날짜':c.total?'완료 '+c.done+'/'+c.total+'회':'예정 없음'}">${i+1}<small>${future?'—':c.total?`완료 ${c.done}/${c.total}회`:'예정 없음'}</small></button>`}).join('')}</div>`}
function range(d,type){if(type==='week'){let start=addDays(d,-((parseDate(d).getDay()+6)%7));return [start,addDays(start,6)]}let start=d.slice(0,7)+'-01',n=new Date(+d.slice(0,4),+d.slice(5,7),0).getDate();return[start,start.slice(0,8)+pad(n)]}
function periodList(){let [start,end]=range(selected,mode),parts=[];for(let d=start;d<=end&&d<=today();d=addDays(d,1)){let a=rows(d),p=prns(d),c=counts(d);parts.push(`<section class="card"><div class="row"><h3>${d}</h3><button data-action="pickday" data-date="${d}">상세·수정</button></div><p class="sub">${c.total?`완료 ${c.done}/${c.total}회 · 남음 ${c.total-c.done}회`:'예정 없음'}</p>${a.map(r=>`<div class="recordline"><strong>${r.time} · ${esc(r.name)}</strong> · ${esc(r.dose)}<br>${r.done?'복용 완료 · '+(r.unknown?'시각 미상':esc(r.actual)):'미복용'}${r.note?`<p class="memo">${esc(r.note)}</p>`:''}</div>`).join('')}${p.map(r=>`<div class="recordline">필요시약 · ${esc(r.name)} · ${esc(r.dose)} · ${r.unknown?'시각 미상':esc(r.actual)}${r.note?`<p class="memo">${esc(r.note)}</p>`:''}</div>`).join('')}${db.daily[d]?`<p class="memo">하루 메모: ${esc(db.daily[d])}</p>`:''}</section>`)}return `<p class="period"><strong>${start} ~ ${end}</strong><br><span class="sub">${mode==='week'?'월요일부터 일요일까지':'해당 월 1일부터 말일까지'} · 오늘까지의 기록</span></p>${parts.join('')}`}
function openModal(html){$('#modalContent').innerHTML=html;$('#modal').showModal()}
function closeModal(){ $('#modal').close() }
function formFooter(label){return `<p id="formError" class="error" role="alert"></p><div class="dialogfoot"><button type="button" data-action="close">취소</button><button class="primary" type="submit">${label}</button></div>`}
function timeInput(t=''){return `<div class="timeentry"><input type="time" class="scheduledTime" aria-label="예정 복용 시각" value="${t}"><button type="button" data-action="removetime" aria-label="이 시각 삭제">삭제</button></div>`}
function medForm(id){let m=db.meds.find(x=>x.id===id),v=m?(version(m,today())||m.versions[0]):{name:'',dose:'',start:today(),end:'',info:'',type:'regular',times:['']};openModal(`<h2>${m?'약 정보 수정':'새 약 등록'}</h2><form id="medForm" novalidate data-id="${id||''}">${m?`<label for="effective">변경 적용일 *</label><input id="effective" type="date" min="${today()}" value="${today()}"><p class="sub">오늘은 미복용 일정부터 적용합니다. 완료 건은 유지합니다.</p>`:''}<label for="medName">약 이름 *</label><input id="medName" value="${esc(v.name)}"><label for="medDose">1회 복용량 *</label><input id="medDose" placeholder="예: 1정" value="${esc(v.dose)}"><label for="medType">복용 방식</label><select id="medType"><option value="regular" ${v.type==='regular'?'selected':''}>정기약 · 매일 정해진 시각</option><option value="prn" ${v.type==='prn'?'selected':''}>필요시약 · 먹을 때마다 기록</option></select><div id="timesWrap" ${v.type==='prn'?'hidden':''}><label>예정 복용 시각 *</label><div id="timeInputs">${(v.times.length?v.times:['']).map(timeInput).join('')}</div><button type="button" data-action="addtime">＋ 시각 추가</button></div><div class="grid2"><div><label for="start">시작일 *</label><input type="date" id="start" value="${v.start}"></div><div><label for="end">종료일 (선택)</label><input type="date" id="end" value="${v.end}"></div></div><label for="medInfo">복용 관련 메모 (선택)</label><textarea id="medInfo">${esc(v.info)}</textarea>${formFooter('저장')}</form>`)}
function submitMed(){let id=$('#medForm').dataset.id,m=db.meds.find(x=>x.id===id),name=$('#medName').value.trim(),dose=$('#medDose').value.trim(),start=$('#start').value,end=$('#end').value,type=$('#medType').value,times=type==='regular'?[...document.querySelectorAll('.scheduledTime')].map(x=>x.value):[],effective=m?$('#effective').value:start;
let error=!name?'약 이름을 입력해 주세요.':!dose?'1회 복용량을 입력해 주세요.':!start?'시작일을 입력해 주세요.':end&&end<start?'종료일은 시작일보다 빠를 수 없습니다.':type==='regular'&&(!times.length||times.some(x=>!x))?'예정 복용 시각을 모두 입력해 주세요.':new Set(times).size!==times.length?'같은 예정 시각을 중복 입력할 수 없습니다.':m&&(!effective||effective<today())?'적용일은 오늘 이후 날짜로 선택해 주세요.':'';if(error){$('#formError').textContent=error;return}if(m&&effective===today())freezeCompleted(m,effective);let v={effective,seq:Date.now(),name,dose,start,end,type,times:times.sort(),info:$('#medInfo').value.trim(),stopped:false};if(m)m.versions.push(v);else db.meds.push({id:uid(),versions:[v]});save();closeModal();render()}
function stopForm(id){let m=db.meds.find(x=>x.id===id),v=version(m,today())||m.versions[0];openModal(`<h2>복용 중단</h2><p>${esc(v.name)}</p><form id="stopForm" data-id="${id}"><label for="effective">중단 적용일</label><input id="effective" type="date" min="${today()}" value="${today()}" required><p class="sub">오늘 중단하면 미복용 일정은 제외하고 완료 기록은 남깁니다. 이후에 예약된 변경도 중단 적용일부터 취소됩니다.</p>${formFooter('중단 적용')}</form>`)}
function recordForm(key,d,checking=false){let r=rows(d).find(x=>x.key===key);if(!r)return;openModal(`<h2>${checking?'지난 복용 기록':'복용 시각·메모'}</h2><p>${esc(r.name)} · ${d} · 예정 ${r.time}</p><form id="recordForm" data-key="${key}" data-date="${d}" data-checking="${checking}">${r.done||checking?`<label for="actual">실제 복용 시각</label><input type="time" id="actual" value="${r.actual}" ${r.unknown?'disabled':''}><label><input type="checkbox" id="unknown" ${r.unknown?'checked':''}> 시각 미상</label>`:''}<label for="recordNote">이 복용 건의 메모</label><textarea id="recordNote">${esc(r.note)}</textarea>${formFooter('저장')}</form>`)}
function prnForm(d,key){let rec=key?db.records[key]:null,options=db.meds.map(m=>({m,v:version(m,d)})).filter(x=>active(x.v,d)&&x.v.type==='prn');if(!rec&&!options.length){openModal(`<h2>필요시약을 먼저 등록해 주세요</h2><p>선택한 날짜에 복용할 수 있는 필요시약이 없습니다. 약 등록·관리에서 복용 방식을 ‘필요시약’으로 선택해 등록해 주세요.</p><div class="dialogfoot"><button data-action="close">닫기</button></div>`);return}openModal(`<h2>필요시약 ${rec?'기록 수정':'복용 기록'}</h2><p>${d}</p><form id="prnForm" data-date="${d}" data-key="${key||''}">${rec?`<p><strong>${esc(rec.snapshot.name)}</strong> · ${esc(rec.snapshot.dose)}</p>`:`<label for="prnMed">복용한 약</label><select id="prnMed">${options.map(({m,v})=>`<option value="${m.id}">${esc(v.name)} · ${esc(v.dose)}</option>`).join('')}</select>`}<label for="actual">실제 복용 시각</label><input type="time" id="actual" value="${rec?rec.actual||'':d===today()?nowTime():''}" ${rec?.unknown?'disabled':''}><label><input type="checkbox" id="unknown" ${rec?.unknown?'checked':''}> 시각 미상</label><label for="recordNote">복용 메모</label><textarea id="recordNote">${esc(rec?.note||'')}</textarea>${formFooter('저장')}</form>`)}
function alertRender(){let box=$('#alerts');box.hidden=!alertItems.size;if(alertItems.size)box.innerHTML=`<div class="row"><strong>복용 시각을 확인해 주세요</strong><button data-action="dismiss">닫기</button></div><p class="sub">알림을 닫아도 복용 완료로 처리되지 않습니다.</p><ul>${[...alertItems.values()].map(r=>`<li>${esc(r.name)} · 예정 ${r.time}</li>`).join('')}</ul>`}
function checkAlerts(){if(document.hidden)return;let a=rows(today()).filter(r=>!r.done&&r.time<=nowTime());for(let r of a)if(!seen.has(r.key)){seen.add(r.key);alertItems.set(r.key,r)}alertRender()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.mode){mode=b.dataset.mode;render();return}let {action:a,key,date:d,id}=b.dataset;
if(a==='close')closeModal();if(a==='newmed')medForm();if(a==='editmed')medForm(id);if(a==='stop')stopForm(id);if(a==='addtime')$('#timeInputs').insertAdjacentHTML('beforeend',timeInput());if(a==='removetime')b.parentElement.remove();if(a==='record')recordForm(key,d);if(a==='addprn')prnForm(d);if(a==='prnedit')prnForm(d,key);if(a==='dismiss'){alertItems.clear();alertRender()}if(a==='pickday'){selected=d;month=d.slice(0,7);tab='history';mode='day';render()}if(a==='prevmonth'||a==='nextmonth'){let dt=parseDate(month+'-01');dt.setMonth(dt.getMonth()+(a==='prevmonth'?-1:1));month=dateStr(dt).slice(0,7);render()}if(a==='toggle'){let r=rows(d).find(x=>x.key===key);if(r.done){let rec=ensure(r);rec.done=false;rec.actual='';rec.unknown=false;seen.delete(key);save();render()}else if(d===today()){let rec=ensure(r);rec.done=true;rec.actual=nowTime();rec.unknown=false;save();render()}else recordForm(key,d,true)}});
document.addEventListener('input',e=>{if(e.target.id==='dayNote'){db.daily[e.target.dataset.date]=e.target.value;save()}});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='selectDate'&&el.value&&el.value<=today()){selected=el.value;month=selected.slice(0,7);render()}if(el.id==='medType')$('#timesWrap').hidden=el.value==='prn';if(el.id==='unknown'){$('#actual').disabled=el.checked;if(el.checked)$('#actual').value=''}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target;if(f.id==='medForm')submitMed();if(f.id==='stopForm'){let m=db.meds.find(x=>x.id===f.dataset.id),effective=$('#effective').value;if(!effective||effective<today()){$('#formError').textContent='적용일은 오늘 이후 날짜로 선택해 주세요.';return}if(effective===today())freezeCompleted(m,effective);let v=version(m,effective)||m.versions[0];m.versions=m.versions.filter(x=>x.effective<effective);m.versions.push({...v,effective,seq:Date.now(),stopped:true});save();closeModal();render()}
if(f.id==='recordForm'||f.id==='prnForm'){let act=$('#actual'),unknown=$('#unknown')?.checked||false;if(act&&!unknown&&!act.value){$('#formError').textContent='실제 복용 시각을 입력하거나 시각 미상을 선택해 주세요.';return}let rec;if(f.id==='recordForm'){let r=rows(f.dataset.date).find(x=>x.key===f.dataset.key);rec=ensure(r);if(f.dataset.checking==='true')rec.done=true}else{let key=f.dataset.key||uid();rec=db.records[key];if(!rec){let m=db.meds.find(x=>x.id===$('#prnMed').value),v=version(m,f.dataset.date);rec=db.records[key]={prn:true,done:true,date:f.dataset.date,medId:m.id,snapshot:{name:v.name,dose:v.dose,info:v.info}}}}if(act){rec.actual=unknown?'':act.value;rec.unknown=unknown}rec.note=$('#recordNote').value;save();closeModal();render()}});
let lastMinute=nowTime();setInterval(()=>{if(document.hidden)return;if(today()!==dayAtOpen){dayAtOpen=today();selected=today();month=selected.slice(0,7);seen.clear();alertItems.clear();render()}else {checkAlerts();if(lastMinute!==nowTime()){lastMinute=nowTime();if(tab==='today'&&!$('#modal').open&&document.activeElement?.tagName!=='TEXTAREA')render()}}},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){seen.clear();checkAlerts()}});window.addEventListener('pageshow',()=>{seen.clear();checkAlerts()});render();
</script></body></html>
